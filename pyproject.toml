[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taxdiff"
version = "0.1.0"
description = "Change-impact triage for prepared tax returns"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # tested on 3.12; the hosted API runs 3.12
# The engine, the command line and the web API. This is everything the hosted API installs.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "fastapi>=0.115",
    "anthropic>=2.3,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.66", "pandas>=2.1"]  # the local review screen; the release the screen is tested on
parity = ["policyengine-us==2.90.4"]  # the shipped cache and the $0.50 tolerance were measured on this release
llm = ["anthropic>=2.3,<3"]  # kept for older install commands; anthropic is now a base dependency
docs = ["docling>=2.40", "fpdf2>=2.8"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "uvicorn>=0.30", "playwright>=1.50"]

[project.scripts]
taxdiff = "taxdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "src.taxdiff.api.app:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["e2e: browser tests against a running dashboard (set TAXDIFF_E2E_URL)"]
